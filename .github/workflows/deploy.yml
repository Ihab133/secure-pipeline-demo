name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Pretend to deploy to dev
        run: echo "Deploying to DEV"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: prod
    steps:
      - name: Pretend to deploy to prod
        run: echo "Deploying to PROD"